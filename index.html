<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<meta name="description" content="My Digital Office — multilingual personal workspace">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>My Digital Office</title>
<style>
:root{--bg:#f3f5f8;--panel:#fff;--ink:#172033;--muted:#64748b;--line:#e4e9f0;--accent:#3157d5;--nav:#101827;--good:#137a50;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:white}
button.secondary{background:#e9eefb;color:#233b8f}button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}button.danger{background:#fff0ef;color:var(--bad)}
header{background:var(--nav);color:white;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5}
.brand{font-weight:750;font-size:18px}.head-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input,textarea{border:1px solid var(--line);border-radius:9px;padding:10px;background:white;color:var(--ink);width:100%}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 60px)}
aside{background:#fff;border-inline-end:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:6px}
.nav{background:transparent;color:#334155;text-align:start;border-radius:9px;padding:11px}.nav.active{background:#edf1ff;color:#2345b5;font-weight:700}
main{padding:24px;max-width:1450px;width:100%;margin:auto}
h1{font-size:25px;margin:0 0 5px}h2{font-size:18px;margin:0 0 14px}.muted{color:var(--muted)}.small{font-size:12px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:20px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:17px;min-width:0}
.metric{font-size:28px;font-weight:750;margin-top:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.stack{display:grid;gap:12px}.split{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.item{padding:12px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}.item:last-child{border:0}
.item .body{flex:1;min-width:0}.item strong{display:block;overflow-wrap:anywhere}
.tag{display:inline-block;padding:3px 8px;border-radius:99px;background:#eef2ff;color:#3149a5;font-size:12px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.form label{display:grid;gap:5px;color:#475569;font-size:13px}.form .wide{grid-column:1/-1}
.empty{padding:22px;text-align:center;color:var(--muted)}
.status{font-size:12px;padding:5px 9px;border-radius:20px;background:#f1f5f9;color:#475569}.status.ok{background:#e8f7ef;color:var(--good)}.status.err{background:#fff0ef;color:var(--bad)}
#modal{position:fixed;inset:0;background:#10182788;display:none;align-items:center;justify-content:center;padding:15px;z-index:10}#modal.show{display:flex}.modalbox{background:white;border-radius:16px;padding:20px;width:min(560px,100%);max-height:90vh;overflow:auto}
footer{padding:18px;color:var(--muted);text-align:center;font-size:12px}
@media(max-width:850px){.shell{grid-template-columns:1fr}aside{position:sticky;top:57px;z-index:4;flex-direction:row;overflow:auto;border-inline-end:0;border-bottom:1px solid var(--line);padding:8px}.nav{white-space:nowrap;padding:9px 12px}main{padding:16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}}
@media(max-width:480px){header{padding:10px 12px}.brand{font-size:16px}.grid{gap:9px}.card{padding:13px}.metric{font-size:24px}.form{grid-template-columns:1fr}.form .wide{grid-column:auto}}
</style>
</head>
<body>
<header>
 <div class="brand">◈ My Digital Office</div>
 <div class="head-actions">
  <span id="syncStatus" class="status">Local</span>
  <select id="language" aria-label="Language" style="width:auto;min-width:115px" onchange="setLang(this.value)">
   <option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option>
  </select>
  <button class="ghost" style="color:white;border-color:#475569" onclick="openSettings()" id="settingsBtn">الإعدادات</button>
 </div>
</header>
<div class="shell">
<aside id="sidebar">
 <button class="nav active" data-page="dashboard" onclick="go('dashboard')">لوحة القيادة</button>
 <button class="nav" data-page="tasks" onclick="go('tasks')">المهام</button>
 <button class="nav" data-page="projects" onclick="go('projects')">المشاريع</button>
 <button class="nav" data-page="documents" onclick="go('documents')">فهرس الوثائق</button>
 <button class="nav" data-page="notes" onclick="go('notes')">الملاحظات</button>
 <button class="nav" data-page="settings" onclick="go('settings')">الربط والمزامنة</button>
</aside>
<main id="main"></main>
</div>
<footer>My Digital Office · v0.3 · Local-first + Cloud-ready</footer>
<div id="modal"><div class="modalbox"><div class="row"><h2 id="modalTitle"> </h2><button class="ghost" onclick="closeModal()">✕</button></div><div id="modalContent"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const T={
 ar:{dashboard:"لوحة القيادة",tasks:"المهام",projects:"المشاريع",documents:"فهرس الوثائق",notes:"الملاحظات",settings:"الربط والمزامنة",settingsBtn:"الإعدادات",welcome:"مكتبك الرقمي في مكان واحد",overview:"نظرة عامة",openTasks:"المهام المفتوحة",projectsCount:"المشاريع",docsCount:"الوثائق المفهرسة",notesCount:"الملاحظات",recentTasks:"آخر المهام",quick:"إجراءات سريعة",addTask:"إضافة مهمة",addProject:"إضافة مشروع",addDoc:"فهرسة وثيقة",addNote:"ملاحظة جديدة",title:"العنوان",details:"التفاصيل",due:"تاريخ الاستحقاق",status:"الحالة",pending:"قيد التنفيذ",done:"مكتملة",project:"المشروع",name:"الاسم",path:"مسار/مكان الوثيقة",save:"حفظ",cancel:"إلغاء",delete:"حذف",empty:"لا توجد بيانات بعد.",taskTitle:"مهمة جديدة",projectTitle:"مشروع جديد",docTitle:"وثيقة جديدة",noteTitle:"ملاحظة جديدة",cloud:"إعداد الاتصال السحابي",url:"Supabase Project URL",key:"Supabase anon/public key",email:"البريد الإلكتروني",password:"كلمة المرور",signup:"إنشاء حساب",login:"تسجيل الدخول",logout:"تسجيل الخروج",connect:"حفظ إعدادات الاتصال",sync:"مزامنة الآن",export:"تصدير نسخة JSON",import:"استيراد نسخة JSON",local:"تخزين محلي",connected:"متصل بالسحابة",notConnected:"غير مربوط بالسحابة",cloudHint:"للمزامنة بين الهاتف والحاسوب تحتاج مشروع Supabase مجانيًا، ثم إعداد SQL الموجود في مجلد المشروع.",security:"لا تضع بيانات سرية أو ملفات مؤسستك قبل اعتماد سياسة أمن المعلومات. استخدم حسابًا شخصيًا تجريبيًا أولًا.",saved:"تم الحفظ",loginFirst:"سجّل الدخول أولًا.",syncOk:"اكتملت المزامنة",syncErr:"تعذرت المزامنة",install:"تثبيت التطبيق",installHelp:"من قائمة المتصفح اختر «إضافة إلى الشاشة الرئيسية» إذا لم يظهر زر التثبيت.",offline:"قد تعمل الواجهة دون اتصال بعد زيارتها أول مرة؛ المزامنة تتطلب الإنترنت.",noTitle:"أدخل عنوانًا صحيحًا."},
 fr:{dashboard:"Tableau de bord",tasks:"Tâches",projects:"Projets",documents:"Documents",notes:"Notes",settings:"Connexion & synchronisation",settingsBtn:"Paramètres",welcome:"Votre espace de travail numérique",overview:"Vue d’ensemble",openTasks:"Tâches ouvertes",projectsCount:"Projets",docsCount:"Documents indexés",notesCount:"Notes",recentTasks:"Tâches récentes",quick:"Actions rapides",addTask:"Ajouter une tâche",addProject:"Ajouter un projet",addDoc:"Indexer un document",addNote:"Nouvelle note",title:"Titre",details:"Détails",due:"Échéance",status:"Statut",pending:"En cours",done:"Terminée",project:"Projet",name:"Nom",path:"Chemin / emplacement",save:"Enregistrer",cancel:"Annuler",delete:"Supprimer",empty:"Aucune donnée.",taskTitle:"Nouvelle tâche",projectTitle:"Nouveau projet",docTitle:"Nouveau document",noteTitle:"Nouvelle note",cloud:"Configuration cloud",url:"URL du projet Supabase",key:"Clé anon/public Supabase",email:"E-mail",password:"Mot de passe",signup:"Créer un compte",login:"Connexion",logout:"Déconnexion",connect:"Enregistrer la connexion",sync:"Synchroniser",export:"Exporter JSON",import:"Importer JSON",local:"Stockage local",connected:"Cloud connecté",notConnected:"Cloud non connecté",cloudHint:"Pour synchroniser téléphone et ordinateur, créez un projet Supabase gratuit et exécutez le SQL fourni dans le dossier.",security:"N’enregistrez pas de données sensibles ou professionnelles avant validation de la sécurité informatique. Commencez avec un compte de test.",saved:"Enregistré",loginFirst:"Connectez-vous d’abord.",syncOk:"Synchronisation terminée",syncErr:"Échec de synchronisation",install:"Installer l’application",installHelp:"Dans le menu du navigateur, choisissez « Ajouter à l’écran d’accueil » si le bouton d’installation n’apparaît pas.",offline:"L’interface peut fonctionner hors ligne après la première visite ; la synchronisation nécessite Internet.",noTitle:"Veuillez saisir un titre."},
 en:{dashboard:"Dashboard",tasks:"Tasks",projects:"Projects",documents:"Document index",notes:"Notes",settings:"Cloud & sync",settingsBtn:"Settings",welcome:"Your digital workspace",overview:"Overview",openTasks:"Open tasks",projectsCount:"Projects",docsCount:"Indexed documents",notesCount:"Notes",recentTasks:"Recent tasks",quick:"Quick actions",addTask:"Add task",addProject:"Add project",addDoc:"Index document",addNote:"New note",title:"Title",details:"Details",due:"Due date",status:"Status",pending:"In progress",done:"Completed",project:"Project",name:"Name",path:"Document path / location",save:"Save",cancel:"Cancel",delete:"Delete",empty:"No data yet.",taskTitle:"New task",projectTitle:"New project",docTitle:"New document",noteTitle:"New note",cloud:"Cloud connection setup",url:"Supabase Project URL",key:"Supabase anon/public key",email:"Email",password:"Password",signup:"Create account",login:"Log in",logout:"Log out",connect:"Save connection settings",sync:"Sync now",export:"Export JSON backup",import:"Import JSON backup",local:"Local storage",connected:"Cloud connected",notConnected:"Cloud not connected",cloudHint:"To sync phone and computer, create a free Supabase project and run the SQL file included in this folder.",security:"Do not store sensitive or workplace data until your IT security policy is approved. Start with a test account.",saved:"Saved",loginFirst:"Please log in first.",syncOk:"Sync completed",syncErr:"Sync failed",install:"Install app",installHelp:"In your browser menu, choose “Add to Home screen” if the install button is unavailable.",offline:"The interface may work offline after the first visit; syncing requires internet.",noTitle:"Enter a valid title."}
};
const blank=()=>({tasks:[],projects:[],documents:[],notes:[]});
let db=JSON.parse(localStorage.getItem("mdo_v03_data")||"null")||blank(),lang=localStorage.getItem("mdo_lang")||"ar",page="dashboard",supabaseClient=null,session=null,installPrompt=null;
const tr=k=>T[lang][k]||k;
function persist(){localStorage.setItem("mdo_v03_data",JSON.stringify(db));}
function setLang(v){lang=v;localStorage.setItem("mdo_lang",v);document.documentElement.lang=v;document.documentElement.dir=v==="ar"?"rtl":"ltr";render()}
function go(p){page=p;document.querySelectorAll(".nav").forEach(x=>x.classList.toggle("active",x.dataset.page===p));render()}
function metric(label,n){return `<div class="card"><div class="muted">${label}</div><div class="metric">${n}</div></div>`}
function render(){
 document.getElementById("language").value=lang;
 document.getElementById("settingsBtn").textContent=tr("settingsBtn");
 document.querySelectorAll(".nav").forEach(x=>{x.textContent=tr(x.dataset.page);});
 const m=document.getElementById("main");
 if(page==="dashboard"){m.innerHTML=`<h1>${tr("welcome")}</h1><div class="muted">${tr("overview")}</div>
 <div class="grid">${metric(tr("openTasks"),db.tasks.filter(x=>!x.done).length)}${metric(tr("projectsCount"),db.projects.length)}${metric(tr("docsCount"),db.documents.length)}${metric(tr("notesCount"),db.notes.length)}</div>
 <div class="split"><section class="card"><h2>${tr("recentTasks")}</h2>${db.tasks.slice(-5).reverse().map(taskHTML).join("")||`<div class="empty">${tr("empty")}</div>`}</section>
 <section class="card"><h2>${tr("quick")}</h2><div class="stack"><button onclick="openForm('tasks')">${tr("addTask")}</button><button class="secondary" onclick="openForm('projects')">${tr("addProject")}</button><button class="secondary" onclick="openForm('documents')">${tr("addDoc")}</button><button class="secondary" onclick="openForm('notes')">${tr("addNote")}</button></div></section></div>
 <div class="card" style="margin-top:14px"><h2>${tr("install")}</h2><div class="muted">${tr("installHelp")} ${tr("offline")}</div><div class="actions"><button class="secondary" onclick="installApp()">${tr("install")}</button></div></div>`;
 }else if(page==="tasks"){m.innerHTML=`<div class="row"><div><h1>${tr("tasks")}</h1></div><button onclick="openForm('tasks')">${tr("addTask")}</button></div><div class="card" style="margin-top:15px">${db.tasks.map(taskHTML).join("")||`<div class="empty">${tr("empty")}</div>`}</div>`}
 else if(page==="projects"){m.innerHTML=`<div class="row"><h1>${tr("projects")}</h1><button onclick="openForm('projects')">${tr("addProject")}</button></div><div class="grid">${db.projects.map(x=>`<div class="card"><div class="row"><strong>${esc(x.title)}</strong><button class="danger" onclick="removeItem('projects','${x.id}')">${tr("delete")}</button></div><p class="muted">${esc(x.details||"")}</p></div>`).join("")||`<div class="card empty">${tr("empty")}</div>`}</div>`}
 else if(page==="documents"){m.innerHTML=`<div class="row"><h1>${tr("documents")}</h1><button onclick="openForm('documents')">${tr("addDoc")}</button></div><div class="card" style="margin-top:15px">${db.documents.map(x=>`<div class="item"><div class="body"><strong>${esc(x.title)}</strong><span class="muted small">${esc(x.path||"")}</span></div><button class="danger" onclick="removeItem('documents','${x.id}')">${tr("delete")}</button></div>`).join("")||`<div class="empty">${tr("empty")}</div>`}</div>`}
 else if(page==="notes"){m.innerHTML=`<div class="row"><h1>${tr("notes")}</h1><button onclick="openForm('notes')">${tr("addNote")}</button></div><div class="grid">${db.notes.map(x=>`<div class="card"><div class="row"><strong>${esc(x.title)}</strong><button class="danger" onclick="removeItem('notes','${x.id}')">${tr("delete")}</button></div><p>${esc(x.details||"")}</p></div>`).join("")||`<div class="card empty">${tr("empty")}</div>`}</div>`}
 else {m.innerHTML=settingsHTML()}
 updateStatus();
}
function taskHTML(x){return `<div class="item"><input type="checkbox" style="width:18px;margin-top:4px" ${x.done?"checked":""} onchange="toggleTask('${x.id}',this.checked)"><div class="body"><strong style="${x.done?'text-decoration:line-through;color:#94a3b8':''}">${esc(x.title)}</strong><span class="muted small">${esc(x.due||"")} ${x.details?" · "+esc(x.details):""}</span></div><button class="danger" onclick="removeItem('tasks','${x.id}')">${tr("delete")}</button></div>`}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function openForm(type){
 const fields=type==="tasks"?`<label>${tr("title")}<input id="fTitle" required></label><label>${tr("due")}<input id="fDue" type="date"></label><label class="wide">${tr("details")}<textarea id="fDetails" rows="3"></textarea></label>`:
 type==="projects"?`<label>${tr("title")}<input id="fTitle" required></label><label class="wide">${tr("details")}<textarea id="fDetails" rows="3"></textarea></label>`:
 type==="documents"?`<label>${tr("name")}<input id="fTitle" required></label><label class="wide">${tr("path")}<input id="fPath" placeholder="Ex: Drive/Approvisionnement/DA-2026-001"></label>`:
 `<label>${tr("title")}<input id="fTitle" required></label><label class="wide">${tr("details")}<textarea id="fDetails" rows="5"></textarea></label>`;
 document.getElementById("modalTitle").textContent=tr(type==="tasks"?"taskTitle":type==="projects"?"projectTitle":type==="documents"?"docTitle":"noteTitle");
 document.getElementById("modalContent").innerHTML=`<div class="form">${fields}</div><div class="actions"><button onclick="saveForm('${type}')">${tr("save")}</button><button class="ghost" onclick="closeModal()">${tr("cancel")}</button></div>`;
 document.getElementById("modal").classList.add("show");
}
function saveForm(type){let title=document.getElementById("fTitle").value.trim();if(!title){alert(tr("noTitle"));return}
 const x={id:crypto.randomUUID(),title,details:document.getElementById("fDetails")?.value||"",created:new Date().toISOString()};
 if(type==="tasks"){x.due=document.getElementById("fDue").value;x.done=false}
 if(type==="documents")x.path=document.getElementById("fPath").value;
 db[type].push(x);persist();closeModal();render()}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function removeItem(type,id){if(!confirm(tr("delete")+"?"))return;db[type]=db[type].filter(x=>x.id!==id);persist();render()}
function toggleTask(id,v){let x=db.tasks.find(x=>x.id===id);if(x)x.done=v;persist();render()}
function settingsHTML(){return `<h1>${tr("settings")}</h1><div class="card" style="margin-top:15px"><h2>${tr("cloud")}</h2><p class="muted">${tr("cloudHint")}</p><div class="form"><label class="wide">${tr("url")}<input id="sbUrl" placeholder="https://xxxx.supabase.co" value="${esc(localStorage.getItem("mdo_sb_url")||"")}"></label><label class="wide">${tr("key")}<textarea id="sbKey" rows="2" placeholder="eyJ...">${esc(localStorage.getItem("mdo_sb_key")||"")}</textarea></label><label>${tr("email")}<input id="sbEmail" type="email"></label><label>${tr("password")}<input id="sbPassword" type="password"></label></div><div class="actions"><button onclick="saveCloud()">${tr("connect")}</button><button class="secondary" onclick="auth('login')">${tr("login")}</button><button class="secondary" onclick="auth('signup')">${tr("signup")}</button><button class="ghost" onclick="auth('logout')">${tr("logout")}</button></div><div class="actions"><button onclick="syncCloud()">${tr("sync")}</button><button class="secondary" onclick="exportData()">${tr("export")}</button><label class="secondary" style="padding:10px 14px;border-radius:10px;cursor:pointer">${tr("import")}<input type="file" accept="application/json" hidden onchange="importData(event)"></label></div><p class="muted small">${tr("security")}</p></div>`}
function saveCloud(){let u=document.getElementById("sbUrl").value.trim(),k=document.getElementById("sbKey").value.trim();if(!u||!k)return alert("URL / key required");localStorage.setItem("mdo_sb_url",u);localStorage.setItem("mdo_sb_key",k);initSupabase();alert(tr("saved"))}
function initSupabase(){if(!window.supabase)return;let u=localStorage.getItem("mdo_sb_url"),k=localStorage.getItem("mdo_sb_key");if(u&&k){supabaseClient=window.supabase.createClient(u,k);supabaseClient.auth.getSession().then(({data})=>{session=data.session;updateStatus()})}}
async function auth(mode){if(!supabaseClient)initSupabase();if(!supabaseClient)return alert("Save Supabase URL and key first.");let email=document.getElementById("sbEmail")?.value,password=document.getElementById("sbPassword")?.value;let r;
 if(mode==="signup")r=await supabaseClient.auth.signUp({email,password});
 if(mode==="login")r=await supabaseClient.auth.signInWithPassword({email,password});
 if(mode==="logout")r=await supabaseClient.auth.signOut();
 if(r?.error)return alert(r.error.message);let s=await supabaseClient.auth.getSession();session=s.data.session;updateStatus();alert(mode==="logout"?"Signed out":"Authentication request completed. Check your email if confirmation is enabled.");}
async function syncCloud(){if(!supabaseClient)initSupabase();if(!supabaseClient)return alert("Configure Supabase first.");let s=await supabaseClient.auth.getSession();session=s.data.session;if(!session)return alert(tr("loginFirst"));
 let {data,error}=await supabaseClient.from("mdo_workspace").select("payload").eq("user_id",session.user.id).maybeSingle();
 if(error){alert(tr("syncErr")+": "+error.message);return}
 if(data?.payload){if(confirm("Cloud data found. OK = restore cloud to this device; Cancel = upload this device to cloud.")){db={...blank(),...data.payload};persist();render();alert(tr("syncOk"));return}}
 let up=await supabaseClient.from("mdo_workspace").upsert({user_id:session.user.id,payload:db,updated_at:new Date().toISOString()},{onConflict:"user_id"});
 if(up.error){alert(tr("syncErr")+": "+up.error.message);return}alert(tr("syncOk"));updateStatus()}
function updateStatus(){let el=document.getElementById("syncStatus");if(!el)return;el.textContent=session?tr("connected"):tr("local");el.className="status "+(session?"ok":"")}
function exportData(){let a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify({version:3,exported:new Date().toISOString(),data:db},null,2)],{type:"application/json"}));a.href=u;a.download="My_Digital_Office_backup.json";a.click();URL.revokeObjectURL(u)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let o=JSON.parse(r.result);let d=o.data||o;if(!d.tasks||!d.projects||!d.documents||!d.notes)throw Error("Invalid backup structure");if(!confirm("Replace current local data with imported data?"))return;db=d;persist();render()}catch(err){alert("Import failed: "+err.message)}};r.readAsText(f)}
async function installApp(){if(installPrompt){installPrompt.prompt();installPrompt=null}else alert(tr("installHelp"))}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installPrompt=e});
if("serviceWorker" in navigator && location.protocol.startsWith("http"))window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
setLang(lang);initSupabase();render();
</script>
</body></html>
